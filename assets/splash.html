<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; img-src 'self' data:;" />
<title>AI Engineering Companion</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
    background: radial-gradient(circle at 20% 0%, rgba(124, 58, 237, 0.32), transparent 55%),
                radial-gradient(circle at 90% 100%, rgba(34, 211, 238, 0.18), transparent 50%), #070a16;
    color: #e5e9f5;
    display: flex; align-items: center; justify-content: center;
    overflow: hidden; user-select: none; -webkit-app-region: drag;
  }
  .card { width: 100%; height: 100%; padding: 34px 38px; display: flex; flex-direction: column; justify-content: center; position: relative; }
  .glow { position: absolute; width: 260px; height: 260px; border-radius: 50%; filter: blur(70px); opacity: .35; pointer-events: none; }
  .glow.one { background: #7c3aed; top: -120px; right: -80px; }
  .glow.two { background: #06b6d4; bottom: -140px; left: -100px; opacity: .22; }
  .brand { display: flex; align-items: center; gap: 14px; }
  .logo {
    width: 54px; height: 54px; border-radius: 16px;
    background: linear-gradient(135deg, #8b5cf6, #6366f1 55%, #06b6d4);
    display: flex; align-items: center; justify-content: center;
    box-shadow: 0 14px 36px -12px rgba(139, 92, 246, .75), inset 0 1px 0 rgba(255,255,255,.28);
  }
  .logo svg { width: 30px; height: 30px; }
  .eyebrow { font-size: 9px; letter-spacing: .26em; text-transform: uppercase; color: #9aa4bd; }
  h1 { font-size: 20px; font-weight: 650; margin: 3px 0 0; letter-spacing: -.02em; }
  .tagline { margin: 22px 0 0; font-size: 12.5px; line-height: 1.7; color: #98a2ba; max-width: 400px; }
  .tagline strong { color: #c7d0e3; font-weight: 500; }
  .status { margin-top: 26px; }
  .bar { height: 4px; border-radius: 99px; background: rgba(148, 163, 184, .14); overflow: hidden; }
  .bar span { display: block; height: 100%; width: 38%; border-radius: 99px; background: linear-gradient(90deg, #8b5cf6, #22d3ee); animation: slide 1.7s ease-in-out infinite; }
  .status-row { display: flex; align-items: center; gap: 8px; margin-top: 11px; font-size: 10.5px; color: #8d97af; }
  .dot { width: 6px; height: 6px; border-radius: 50%; background: #8b5cf6; box-shadow: 0 0 12px #8b5cf6; animation: pulse 1.5s ease-in-out infinite; }
  .foot { position: absolute; bottom: 20px; left: 38px; right: 38px; display: flex; justify-content: space-between; font-size: 9px; letter-spacing: .08em; color: #5c6479; text-transform: uppercase; }
  @keyframes slide { 0% { transform: translateX(-110%); } 100% { transform: translateX(285%); } }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }
  .error { display: none; }
  body.failed { -webkit-app-region: no-drag; }
  body.failed .status, body.failed .tagline, body.failed .foot { display: none; }
  body.failed .error { display: block; margin-top: 20px; }
  .error-box {
    border: 1px solid rgba(248, 113, 113, .32); background: rgba(248, 113, 113, .07);
    border-radius: 12px; padding: 13px 14px; font-size: 11px; line-height: 1.65; color: #fca5a5;
    max-height: 120px; overflow: auto; -webkit-app-region: no-drag; user-select: text;
  }
  .error-title { font-size: 12px; font-weight: 600; color: #fecaca; margin: 0 0 5px; }
  .close {
    margin-top: 14px; -webkit-app-region: no-drag; cursor: pointer;
    border: 1px solid rgba(148, 163, 184, .25); background: rgba(148, 163, 184, .1);
    color: #d8deeb; border-radius: 9px; padding: 8px 16px; font-size: 11px; font-family: inherit;
  }
  .close:hover { background: rgba(148, 163, 184, .18); }
</style>
</head>
<body>
  <div class="card">
    <div class="glow one"></div>
    <div class="glow two"></div>

    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3 3.5 7.5v9L12 21l8.5-4.5v-9L12 3Z" opacity=".9"/>
          <path d="M12 12 3.5 7.5M12 12l8.5-4.5M12 12v9" opacity=".55"/>
          <circle cx="12" cy="12" r="2.4" fill="#fff" stroke="none"/>
        </svg>
      </div>
      <div>
        <div class="eyebrow">AI Engineering Companion</div>
        <h1>Learn Engineering. Think Deeper.</h1>
      </div>
    </div>

    <p class="tagline">Your private study workspace is starting. <strong>Everything stays on this device</strong> — notes, quizzes, labs and progress.</p>

    <div class="status">
      <div class="bar"><span></span></div>
      <div class="status-row"><span class="dot"></span><span id="status-text">Starting the local learning engine…</span></div>
    </div>

    <div class="error">
      <p class="error-title">The local engine could not start</p>
      <div class="error-box" id="error-text"></div>
      <button class="close" onclick="window.close()">Close</button>
    </div>

    <div class="foot"><span>Local-first · Offline capable</span><span>v1.3.0</span></div>
  </div>

  <script>
    const params = new URLSearchParams(window.location.search);
    const error = params.get("error");
    if (error) {
      document.body.classList.add("failed");
      document.getElementById("error-text").textContent = error;
      document.title = "AI Engineering Companion — startup error";
    }
    const messages = [
      "Starting the local learning engine…",
      "Preparing your indexed study material…",
      "Almost ready…"
    ];
    let index = 0;
    const text = document.getElementById("status-text");
    if (!error && text) {
      setInterval(() => {
        index = (index + 1) % messages.length;
        text.textContent = messages[index];
      }, 2400);
    }
  </script>
</body>
</html>
